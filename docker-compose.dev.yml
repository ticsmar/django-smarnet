# Dev override: Vite com hot reload (sem rebuild a cada alteração).
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up frontend
#
# Na primeira subida o npm ci pode demorar. Depois, edite o código no Cursor
# e a página em http://localhost:3000 atualiza sozinha.

services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    container_name: smar-license-frontend
    ports:
      - "3000:8080"
    volumes:
      - ./frontend:/app
      # Markdown para /docs no app (import.meta.glob ../../../docs)
      - ./docs:/docs
      # node_modules isolado no volume (evita conflito Windows ↔ Alpine)
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_DJANGO_API_URL: http://localhost:8000/api
    command: sh -c "npm ci --legacy-peer-deps && npm run dev -- --host 0.0.0.0 --port 8080"
    restart: unless-stopped

volumes:
  frontend_node_modules:
