version: "3.9"

volumes:
    prometheus_multiproc:

networks:
    monitoring:

services:
    web:
        build: .
        container_name: smar-license-api
        working_dir: /app/backend
        ports:
            - "8000:8000"
        env_file:
            - backend/.env
        environment:
            - ORACLE_HOME=/opt/oracle/instantclient_19_25
            - LD_LIBRARY_PATH=/opt/oracle/instantclient_19_25
            - ORACLE_CLIENT_PATH=/opt/oracle/instantclient_19_25
            - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
        extra_hosts:
            - "dbdesenv:192.168.1.168"
        volumes:
            - .:/app
            - prometheus_multiproc:/tmp/prometheus
        restart: unless-stopped
        networks:
            - default
            - monitoring

    frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile
            args:
                VITE_DJANGO_API_URL: http://localhost:8000/api
                VITE_APP_RUNTIME_ENV: development
        container_name: smar-license-frontend
        ports:
            - "3000:8080"
        restart: unless-stopped

    prometheus:
        image: prom/prometheus:v2.51.0
        container_name: smar-license-prometheus
        volumes:
            - ./.devin/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        ports:
            - "9090:9090"
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=15d"
        restart: unless-stopped
        networks:
            - monitoring

    node-exporter:
        image: prom/node-exporter:v1.7.0
        container_name: smar-license-node-exporter
        volumes:
            - /proc:/host/proc:ro
            - /sys:/host/sys:ro
            - /:/rootfs:ro
        command:
            - "--path.procfs=/host/proc"
            - "--path.sysfs=/host/sys"
            - "--path.rootfs=/rootfs"
        ports:
            - "9100:9100"
        restart: unless-stopped
        networks:
            - monitoring

    grafana:
        image: grafana/grafana-oss:11.0.0
        container_name: smar-license-grafana
        ports:
            - "3001:3000"
        environment:
            - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
            - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
            - GF_USERS_ALLOW_SIGN_UP=false
        volumes:
            - ./.devin/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./.devin/grafana/dashboards:/var/lib/grafana/dashboards:ro
        restart: unless-stopped
        networks:
            - monitoring
